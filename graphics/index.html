<!DOCTYPE html>
<html lang="en">
<head>

  <title>Session Result</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="graphic">
    <div class="layout">
      <div class="event-name" id="event-name"></div>
      <div class="session-name" id="session-name"></div>
      <div class="content" id="content">
        <div class="highlight" id="highlight">
          <img class="logo"   id="highlight-logo"   src="" />

          <img class="number" id="highlight-number" src="" />

        <div class="results" id="results"></div>
      </div>
    </div>
    <img class="logo" id="brand-logo" src="" />
  </div>
  <script src="render.js"></script>
</body>
</html>
